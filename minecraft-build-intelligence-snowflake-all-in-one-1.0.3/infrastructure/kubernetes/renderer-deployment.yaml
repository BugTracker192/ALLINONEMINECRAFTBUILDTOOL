apiVersion: apps/v1
kind: Deployment
metadata: {name: mbi-renderer, namespace: mbi}
spec:
  replicas: 1
  selector: {matchLabels: {app: mbi-renderer}}
  template:
    metadata: {labels: {app: mbi-renderer}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: renderer
          image: ghcr.io/example/mbi-renderer:1.0.0
          ports: [{name: http, containerPort: 8090}]
          envFrom: [{configMapRef: {name: mbi-config}}]
          volumeMounts: [{name: data, mountPath: /data}, {name: tmp, mountPath: /tmp}, {name: shm, mountPath: /dev/shm}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: "1", memory: 2Gi}, limits: {cpu: "4", memory: 6Gi, ephemeral-storage: 2Gi}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 30}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mbi-data}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: mbi-renderer, namespace: mbi}
spec:
  selector: {app: mbi-renderer}
  ports: [{name: http, port: 8090, targetPort: http}]
