[project]
name = "mbi-core"
version = "0.1.0"
description = "Canonical Minecraft structure parsing, analysis, patching, snapshots, and export"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.12.5",
  "pillow==12.0.0",
  "zstandard==0.25.0",
  "httpx>=0.27,<1",
  "cryptography>=43,<48"
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "hypothesis==6.148.7"
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbi"]
