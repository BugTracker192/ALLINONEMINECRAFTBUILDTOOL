name: Bug report
description: Report a reproducible defect
title: "[bug] "
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Include format, dimensions, DataVersion, and a redistributable minimal fixture when possible.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
