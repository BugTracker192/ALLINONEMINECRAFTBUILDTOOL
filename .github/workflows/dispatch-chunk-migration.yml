name: Dispatch Snowflake chunk migration

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/dispatch-chunk-migration-trigger.txt']

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Dispatch, wait for, and report migration workflow v2
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          workflow='migrate-to-snowflake-chunks-v2.yml'
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
          dispatch_status=$?
          sleep 8
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo 'Could not resolve dispatched migration run.' > migration.log
            status=1
          else
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
            status=$?
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > migration.log 2>&1 || true
          fi
          {
            echo "### Snowflake chunk migration v2 run ${run_id:-unknown}"
            echo
            echo "dispatch_status=$dispatch_status final_status=$status"
            echo
            echo '```text'
            tail -c 60000 migration.log
            echo
            echo '```'
          } > migration-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file migration-comment.md || true
          exit "$status"
