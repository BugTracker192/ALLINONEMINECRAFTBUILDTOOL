name: Repair 1.0.3 bootstrap dependency re-exec

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          show-progress: false

      - name: Patch bootstrap and regenerate release manifests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('minecraft-build-intelligence-snowflake-all-in-one-1.0.3')
          bootstrap = root / 'BOOTSTRAP_SNOWFLAKE.py'
          text = bootstrap.read_text('utf-8')
          old = '''    missing = [requirement for module, requirement in MANDATORY if importlib.util.find_spec(module) is None]
              if missing:
                  wheelhouse = ROOT / "vendor" / "wheelhouse"
                  local_wheels = list(wheelhouse.glob("*.whl")) if wheelhouse.is_dir() else []
                  if local_wheels:
                      run("-m", "pip", "install", "--no-index", "--find-links", str(wheelhouse), *missing)
                  else:
                      run("-m", "pip", "install", *missing)
              from app.assets.bundled import ensure_bundled_asset, load_bundled_asset_manifest
          '''
          new = '''    missing = [requirement for module, requirement in MANDATORY if importlib.util.find_spec(module) is None]
              if missing:
                  if os.environ.get("MBI_BOOTSTRAP_REEXEC") == "1":
                      raise SystemExit(
                          "Mandatory dependencies remain unavailable after installation and interpreter restart: "
                          + ", ".join(missing)
                      )
                  wheelhouse = ROOT / "vendor" / "wheelhouse"
                  local_wheels = list(wheelhouse.glob("*.whl")) if wheelhouse.is_dir() else []
                  if local_wheels:
                      run("-m", "pip", "install", "--no-index", "--find-links", str(wheelhouse), *missing)
                  else:
                      run("-m", "pip", "install", *missing)
                  env = os.environ.copy()
                  env["MBI_BOOTSTRAP_REEXEC"] = "1"
                  completed = subprocess.run(
                      [sys.executable, str(Path(__file__).resolve()), *sys.argv[1:]],
                      cwd=ROOT,
                      env=env,
                      check=False,
                  )
                  return completed.returncode
              from app.assets.bundled import ensure_bundled_asset, load_bundled_asset_manifest
          '''
          if old not in text:
              raise SystemExit('Bootstrap dependency block marker not found')
          bootstrap.write_text(text.replace(old, new, 1), 'utf-8')

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()

          source_hashes = root / 'SOURCE_FILES.sha256'
          file_manifest = root / 'RELEASE_FILE_MANIFEST.json'
          source_hashes.unlink(missing_ok=True)
          file_manifest.unlink(missing_ok=True)

          source_files = [p for p in sorted(root.rglob('*')) if p.is_file() and p.name not in {'SOURCE_FILES.sha256', 'RELEASE_FILE_MANIFEST.json'}]
          source_hashes.write_text(''.join(f'{digest(p)}  {p.relative_to(root).as_posix()}\n' for p in source_files), 'utf-8')

          files = [p for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'RELEASE_FILE_MANIFEST.json']
          entries = [{'path': p.relative_to(root).as_posix(), 'size_bytes': p.stat().st_size, 'sha256': digest(p)} for p in files]
          asset_manifest = json.loads((root / 'app/bundled_assets/ASSET_MANIFEST.json').read_text('utf-8'))
          file_manifest.write_text(json.dumps({
              'bundled_asset_sha256': asset_manifest['sha256'],
              'file_count': len(entries),
              'files': entries,
              'profile': 'private-snowflake-coco-all-in-one-chunked',
              'schema_version': '1.1',
              'total_size_bytes': sum(entry['size_bytes'] for entry in entries),
              'version': '1.0.3',
          }, indent=2, sort_keys=True) + '\n', 'utf-8')
          print(json.dumps({'bootstrap_sha256': digest(bootstrap), 'manifest_file_count': len(entries)}, indent=2))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft-build-intelligence-snowflake-all-in-one-1.0.3/BOOTSTRAP_SNOWFLAKE.py \
                  minecraft-build-intelligence-snowflake-all-in-one-1.0.3/SOURCE_FILES.sha256 \
                  minecraft-build-intelligence-snowflake-all-in-one-1.0.3/RELEASE_FILE_MANIFEST.json
          git commit -m 'Restart bootstrap after dependency installation'
          git push origin HEAD:main
