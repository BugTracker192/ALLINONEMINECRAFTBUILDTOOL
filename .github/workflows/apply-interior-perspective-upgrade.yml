name: Apply interior perspective upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_perspective_upgrade.py'
      - '.github/perspective-upgrade-trigger'

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          lfs: false
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply deterministic 1.1.0 upgrade
        run: python tools/apply_perspective_upgrade.py

      - name: Install upgraded release
        working-directory: minecraft-build-intelligence-snowflake-all-in-one-1.1.0
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'

      - name: Run perspective and interior tests
        working-directory: minecraft-build-intelligence-snowflake-all-in-one-1.1.0
        run: |
          pytest -q tests/unit/test_perspective_renderer.py tests/unit/test_cpu_renderer.py tests/integration/test_offline_cli.py

      - name: Run complete Python test suite
        working-directory: minecraft-build-intelligence-snowflake-all-in-one-1.1.0
        run: pytest -q

      - name: Verify release manifest and Snowflake profile
        working-directory: minecraft-build-intelligence-snowflake-all-in-one-1.1.0
        run: |
          python scripts/verify_snowflake_release.py --release-root .
          python scripts/audit_offline_profile.py --output ./perspective-upgrade-audit.json

      - name: Commit verified upgrade to feature branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Upgrade already applied; nothing to commit.'
            exit 0
          fi
          git commit -m 'Add room-aware first-person perspective rendering'
          git push origin "HEAD:${BRANCH}"
