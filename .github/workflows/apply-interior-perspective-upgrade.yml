name: Apply interior perspective upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_perspective_upgrade.py'
      - 'tools/perspective_payload/**'
      - '.github/perspective-upgrade-trigger'

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          lfs: false
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic 1.1.0 upgrade
        run: python tools/apply_perspective_upgrade.py

      - name: Install upgraded release
        working-directory: minecraft-build-intelligence-snowflake-all-in-one-1.1.0
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'

      - name: Run perspective and interior tests
        working-directory: minecraft-build-intelligence-snowflake-all-in-one-1.1.0
        run: |
          pytest -q tests/unit/test_perspective_renderer.py tests/unit/test_cpu_renderer.py tests/integration/test_offline_cli.py

      - name: Run complete Python test suite
        working-directory: minecraft-build-intelligence-snowflake-all-in-one-1.1.0
        run: pytest -q

      - name: Verify byte-exact release manifest
        working-directory: minecraft-build-intelligence-snowflake-all-in-one-1.1.0
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          manifest = json.loads((root / 'RELEASE_FILE_MANIFEST.json').read_text('utf-8'))
          expected = {entry['path']: entry for entry in manifest['files']}
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          expected_actual = set(expected) | {'RELEASE_FILE_MANIFEST.json'}
          missing = sorted(expected_actual - actual)
          extra = sorted(actual - expected_actual)
          mismatches = []
          for relative, entry in sorted(expected.items()):
              path = root / relative
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              size = path.stat().st_size
              if digest != entry['sha256'] or size != entry['size_bytes']:
                  mismatches.append({'path': relative, 'size': size, 'sha256': digest})
          report = {
              'passed': manifest['version'] == '1.1.0' and not missing and not extra and not mismatches,
              'version': manifest['version'],
              'file_count': manifest['file_count'],
              'missing': missing,
              'extra': extra,
              'mismatches': mismatches,
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report['passed']:
              raise SystemExit(1)
          PY

      - name: Audit offline profile and Snowflake bootstrap
        working-directory: minecraft-build-intelligence-snowflake-all-in-one-1.1.0
        env:
          MBI_ASSET_CACHE_DIR: /tmp/mbi-perspective-cache
        run: |
          python scripts/audit_offline_profile.py --output /tmp/perspective-upgrade-audit.json
          python BOOTSTRAP_SNOWFLAKE.py --smoke --out /tmp/mbi-perspective-smoke
          python - <<'PY'
          from pathlib import Path
          import json
          diagnostics = json.loads(Path('/tmp/mbi-perspective-smoke/diagnostics.json').read_text('utf-8'))
          if diagnostics.get('render_mode') != 'software-textured':
              raise SystemExit(f"Expected software-textured, got {diagnostics.get('render_mode')}")
          print(json.dumps({'render_mode': diagnostics.get('render_mode'), 'render_tier': diagnostics.get('render_tier')}, indent=2))
          PY

      - name: Commit verified upgrade to feature branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Upgrade already applied; nothing to commit.'
            exit 0
          fi
          git commit -m 'Add room-aware first-person perspective rendering'
          git push origin "HEAD:${BRANCH}"
