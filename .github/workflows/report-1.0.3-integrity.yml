name: Report exact 1.0.3 integrity mismatches

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          show-progress: false

      - name: Generate exact comparison and reconstruction report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, sys, traceback, zipfile

          root = Path('minecraft-build-intelligence-snowflake-all-in-one-1.0.3')
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()

          report = {'passed': False}
          try:
              manifest = json.loads((root / 'RELEASE_FILE_MANIFEST.json').read_text('utf-8'))
              expected = {entry['path']: entry for entry in manifest['files']}
              actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
              expected_actual = set(expected) | {'RELEASE_FILE_MANIFEST.json'}
              missing = sorted(expected_actual - actual)
              extra = sorted(actual - expected_actual)
              mismatches = []
              for relative, entry in sorted(expected.items()):
                  path = root / relative
                  if not path.is_file():
                      continue
                  size = path.stat().st_size
                  digest = sha256(path)
                  if size != entry['size_bytes'] or digest != entry['sha256']:
                      mismatches.append({
                          'path': relative,
                          'expected_size': entry['size_bytes'],
                          'actual_size': size,
                          'expected_sha256': entry['sha256'],
                          'actual_sha256': digest,
                      })
              asset_manifest = json.loads((root / 'app/bundled_assets/ASSET_MANIFEST.json').read_text('utf-8'))
              parts = []
              parts_ok = True
              parts_dir = root / 'app/bundled_assets' / asset_manifest['delivery']['parts_directory']
              for entry in asset_manifest['delivery']['parts']:
                  path = parts_dir / entry['name']
                  exists = path.is_file()
                  size = path.stat().st_size if exists else None
                  digest = sha256(path) if exists else None
                  passed = exists and size == entry['size_bytes'] and digest == entry['sha256']
                  parts_ok = parts_ok and passed
                  parts.append({'name': entry['name'], 'passed': passed, 'size_bytes': size, 'sha256': digest})

              snapshot = Path('/tmp/mbi-report-snapshot')
              cache = Path('/tmp/mbi-report-cache')
              shutil.rmtree(snapshot, ignore_errors=True)
              shutil.rmtree(cache, ignore_errors=True)
              shutil.copytree(root, snapshot)
              reconstruction = {'passed': False}
              old_cwd = Path.cwd()
              old_cache = os.environ.get('MBI_ASSET_CACHE_DIR')
              try:
                  os.chdir(snapshot)
                  os.environ['MBI_ASSET_CACHE_DIR'] = str(cache)
                  sys.path.insert(0, str(snapshot))
                  from app.assets.bundled import ensure_bundled_asset, load_bundled_asset_manifest
                  runtime_manifest = load_bundled_asset_manifest()
                  rebuilt = ensure_bundled_asset(verify=True)
                  digest = sha256(rebuilt)
                  with zipfile.ZipFile(rebuilt) as archive:
                      infos = archive.infolist()
                      bad_member = archive.testzip()
                      archive_members = sum(1 for info in infos if not info.is_dir())
                      render_relevant = sum(
                          1 for info in infos
                          if not info.is_dir() and (
                              '/blockstates/' in info.filename or
                              '/models/block/' in info.filename or
                              '/textures/' in info.filename or
                              '/atlases/' in info.filename
                          )
                      )
                  reconstruction = {
                      'passed': (
                          rebuilt.stat().st_size == runtime_manifest['size_bytes'] and
                          digest == runtime_manifest['sha256'] and
                          archive_members == runtime_manifest['archive_members'] and
                          render_relevant == runtime_manifest['render_relevant_members'] and
                          bad_member is None
                      ),
                      'path': str(rebuilt),
                      'size_bytes': rebuilt.stat().st_size,
                      'sha256': digest,
                      'archive_members': archive_members,
                      'render_relevant_members': render_relevant,
                      'zip_test_bad_member': bad_member,
                      'git_directory_present': (snapshot / '.git').exists(),
                  }
              except Exception as exc:
                  reconstruction = {
                      'passed': False,
                      'error_type': type(exc).__name__,
                      'error': str(exc),
                      'traceback': traceback.format_exc(),
                  }
              finally:
                  os.chdir(old_cwd)
                  if old_cache is None:
                      os.environ.pop('MBI_ASSET_CACHE_DIR', None)
                  else:
                      os.environ['MBI_ASSET_CACHE_DIR'] = old_cache

              report = {
                  'passed': not missing and not extra and not mismatches and parts_ok and reconstruction.get('passed', False),
                  'version': manifest['version'],
                  'manifest_file_count': manifest['file_count'],
                  'actual_release_file_count': len(actual),
                  'missing': missing,
                  'extra': extra,
                  'mismatches': mismatches,
                  'parts': parts,
                  'reconstruction': reconstruction,
              }
          except Exception as exc:
              report = {'passed': False, 'error': str(exc), 'traceback': traceback.format_exc()}
          Path('report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', 'utf-8')
          print(Path('report.json').read_text('utf-8'))
          PY

      - name: Post report to pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Exact 1.0.3 integrity and reconstruction report'
            echo
            echo '```json'
            cat report.json
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
