name: Verify all-in-one release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and hydrate Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify every release file and bundled asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile, sys

          root = Path('minecraft-build-intelligence-snowflake-all-in-one-1.0.2')
          manifest_path = root / 'RELEASE_FILE_MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          expected = {entry['path']: entry for entry in manifest['files']}
          actual = {
              p.relative_to(root).as_posix()
              for p in root.rglob('*')
              if p.is_file()
          }
          expected_actual = set(expected) | {'RELEASE_FILE_MANIFEST.json'}

          missing = sorted(expected_actual - actual)
          extra = sorted(actual - expected_actual)
          mismatches = []
          verified_bytes = 0

          for rel, entry in sorted(expected.items()):
              path = root / rel
              if not path.is_file():
                  continue
              size = path.stat().st_size
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(8 * 1024 * 1024), b''):
                      h.update(chunk)
              digest = h.hexdigest()
              verified_bytes += size
              if size != entry['size_bytes'] or digest != entry['sha256']:
                  mismatches.append({
                      'path': rel,
                      'expected_size': entry['size_bytes'],
                      'actual_size': size,
                      'expected_sha256': entry['sha256'],
                      'actual_sha256': digest,
                  })

          asset = root / 'app/bundled_assets/minecraft.zip'
          asset_manifest = json.loads((root / 'app/bundled_assets/ASSET_MANIFEST.json').read_text(encoding='utf-8'))
          asset_sha = hashlib.sha256(asset.read_bytes()).hexdigest()
          with zipfile.ZipFile(asset) as zf:
              bad_member = zf.testzip()
              archive_members = len(zf.infolist())
              render_relevant = sum(
                  1 for i in zf.infolist()
                  if i.filename.startswith('assets/') and (
                      '/blockstates/' in i.filename or
                      '/models/block/' in i.filename or
                      '/textures/' in i.filename or
                      '/atlases/' in i.filename
                  ) and not i.is_dir()
              )

          report = {
              'passed': not missing and not extra and not mismatches and bad_member is None,
              'manifest_version': manifest['version'],
              'manifest_file_count': manifest['file_count'],
              'verified_file_count': len(expected),
              'verified_bytes': verified_bytes,
              'missing': missing,
              'extra': extra,
              'mismatches': mismatches,
              'asset': {
                  'sha256': asset_sha,
                  'expected_sha256': asset_manifest['sha256'],
                  'size_bytes': asset.stat().st_size,
                  'expected_size_bytes': asset_manifest['size_bytes'],
                  'archive_members': archive_members,
                  'expected_archive_members': asset_manifest['archive_members'],
                  'render_relevant_members': render_relevant,
                  'expected_render_relevant_members': asset_manifest['render_relevant_members'],
                  'zip_test_bad_member': bad_member,
              },
          }
          Path('integrity-report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))

          if asset_sha != asset_manifest['sha256']:
              report['passed'] = False
          if asset.stat().st_size != asset_manifest['size_bytes']:
              report['passed'] = False
          if archive_members != asset_manifest['archive_members']:
              report['passed'] = False
          if render_relevant != asset_manifest['render_relevant_members']:
              report['passed'] = False
          if not report['passed']:
              sys.exit(1)
          PY

      - name: Run autonomous bootstrap textured smoke test
        working-directory: minecraft-build-intelligence-snowflake-all-in-one-1.0.2
        run: python BOOTSTRAP_SNOWFLAKE.py --smoke

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-in-one-integrity-report
          path: integrity-report.json
