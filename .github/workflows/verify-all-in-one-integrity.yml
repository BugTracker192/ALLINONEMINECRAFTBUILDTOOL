name: Verify all-in-one release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out ordinary Git files only
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          show-progress: false

      - name: Verify base release, feature overlay, and ordinary-Git asset parts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('minecraft-build-intelligence-snowflake-all-in-one-1.0.3')

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def git_blob_sha(path):
              data = path.read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()

          base_path = root / 'RELEASE_FILE_MANIFEST.json'
          overlay_path = root / 'RELEASE_FILE_MANIFEST_PATCH.json'
          release = json.loads(base_path.read_text('utf-8'))
          overlay = json.loads(overlay_path.read_text('utf-8'))
          if overlay.get('schema') != 'mbi.release-manifest-overlay.v1':
              raise SystemExit('Invalid release overlay schema')
          if overlay.get('base_version') != release.get('version'):
              raise SystemExit('Release overlay base version mismatch')
          if overlay.get('base_manifest_git_blob_sha') != git_blob_sha(base_path):
              raise SystemExit('Release overlay base manifest blob mismatch')

          expected = {entry['path']: entry for entry in release['files']}
          for entry in overlay.get('overrides', []):
              if entry['path'] not in expected:
                  raise SystemExit(f"Overlay override is not a base file: {entry['path']}")
              expected[entry['path']] = entry
          for entry in overlay.get('additions', []):
              if entry['path'] in expected:
                  raise SystemExit(f"Overlay addition already exists in base: {entry['path']}")
              expected[entry['path']] = entry
          for relative in overlay.get('deletions', []):
              if relative not in expected:
                  raise SystemExit(f'Overlay deletion is not present: {relative}')
              expected.pop(relative)

          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          expected_actual = set(expected) | {'RELEASE_FILE_MANIFEST.json', 'RELEASE_FILE_MANIFEST_PATCH.json'}
          missing = sorted(expected_actual - actual)
          extra = sorted(actual - expected_actual)
          mismatches = []
          actual_total = 0
          for relative, entry in sorted(expected.items()):
              path = root / relative
              if not path.is_file():
                  continue
              size = path.stat().st_size
              digest = sha256(path)
              actual_total += size
              if size != entry['size_bytes'] or digest != entry['sha256']:
                  mismatches.append({
                      'path': relative,
                      'expected_size': entry['size_bytes'],
                      'actual_size': size,
                      'expected_sha256': entry['sha256'],
                      'actual_sha256': digest,
                  })

          asset = json.loads((root / 'app/bundled_assets/ASSET_MANIFEST.json').read_text('utf-8'))
          parts_dir = root / 'app/bundled_assets' / asset['delivery']['parts_directory']
          parts = []
          for index, entry in enumerate(asset['delivery']['parts']):
              path = parts_dir / entry['name']
              exists = path.is_file()
              size = path.stat().st_size if exists else None
              digest = sha256(path) if exists else None
              parts.append({
                  'index': index,
                  'name': entry['name'],
                  'passed': exists and size == entry['size_bytes'] and digest == entry['sha256'],
                  'size_bytes': size,
                  'sha256': digest,
              })

          report = {
              'passed': (
                  not missing and not extra and not mismatches
                  and len(expected) == overlay['effective_file_count']
                  and actual_total == overlay['effective_total_size_bytes']
                  and all(item['passed'] for item in parts)
                  and not (root / 'app/bundled_assets/minecraft.zip').exists()
              ),
              'base_version': release['version'],
              'feature_revision': overlay['feature_revision'],
              'effective_file_count': len(expected),
              'actual_release_file_count': len(actual),
              'effective_total_size_bytes': actual_total,
              'missing': missing,
              'extra': extra,
              'mismatches': mismatches,
              'delivery_mode': asset['delivery']['mode'],
              'parts': parts,
              'full_lfs_pointer_absent': not (root / 'app/bundled_assets/minecraft.zip').exists(),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report['passed']:
              raise SystemExit(1)
          PY

      - name: Create extracted Snowflake-style snapshot
        shell: bash
        run: |
          rm -rf /tmp/mbi-snowflake-snapshot /tmp/mbi-snowflake-cache /tmp/mbi-snowflake-smoke /tmp/mbi-perspective-proof
          mkdir -p /tmp/mbi-snowflake-snapshot
          cp -a minecraft-build-intelligence-snowflake-all-in-one-1.0.3/. /tmp/mbi-snowflake-snapshot/
          test ! -e /tmp/mbi-snowflake-snapshot/.git
          test ! -e /tmp/mbi-snowflake-snapshot/app/bundled_assets/minecraft.zip
          test "$(find /tmp/mbi-snowflake-snapshot/app/bundled_assets/parts -type f | wc -l)" -eq 9

      - name: Run autonomous bootstrap with automatic reconstruction and textured smoke
        working-directory: /tmp/mbi-snowflake-snapshot
        env:
          MBI_ASSET_CACHE_DIR: /tmp/mbi-snowflake-cache
        run: python BOOTSTRAP_SNOWFLAKE.py --smoke --out /tmp/mbi-snowflake-smoke

      - name: Prove textured first-person perspective and semantic grounding
        working-directory: /tmp/mbi-snowflake-snapshot
        env:
          MBI_ASSET_CACHE_DIR: /tmp/mbi-snowflake-cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          from mbi.importer import import_build
          from app.assets import open_resource_pack
          from app.render import PerspectiveCameraSpec, PerspectiveRenderer, block_to_pixel, pixel_to_block
          from app.render.semantic import load_map

          fixture = Path('tests/fixtures/reference.schem')
          document = import_build(fixture.read_bytes(), fixture.name)
          b = document.bounds
          target = tuple((a + c + 1) / 2.0 for a, c in zip(b.min.as_tuple(), b.max.as_tuple(), strict=True))
          camera = PerspectiveCameraSpec(
              position=(target[0] + 8.0, target[1] + 5.0, target[2] - 10.0),
              target=target,
              vertical_fov_degrees=68.0,
              near=0.05,
          )
          pack = open_resource_pack(None)
          try:
              result = PerspectiveRenderer(document, resource_pack=pack).render(
                  '/tmp/mbi-perspective-proof', camera=camera, size=(320, 200), mode='textured', name='first_person'
              )
          finally:
              if pack:
                  pack.close()
          coordinates = load_map(result.semantic_metadata_path, 'coordinate')
          ys, xs = np.where(coordinates[..., 0] != np.iinfo(np.int32).min)
          if not len(xs):
              raise SystemExit('Perspective proof produced no grounded pixels')
          px, py = int(xs[0]), int(ys[0])
          hit = pixel_to_block(result.manifest_path, px, py)
          if hit is None or {'px': px, 'py': py} not in block_to_pixel(result.manifest_path, *hit['coordinate']):
              raise SystemExit('Perspective pixel/block grounding failed')
          report = {
              'passed': result.manifest['type'] == 'perspective' and result.manifest['render_mode'] == 'software-textured',
              'type': result.manifest['type'],
              'render_mode': result.manifest['render_mode'],
              'camera': result.manifest['camera'],
              'grounded_pixel': [px, py],
              'grounded_block': hit,
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report['passed']:
              raise SystemExit(1)
          PY

      - name: Verify reconstructed archive and textured diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile

          snapshot = Path('/tmp/mbi-snowflake-snapshot')
          manifest = json.loads((snapshot / 'app/bundled_assets/ASSET_MANIFEST.json').read_text('utf-8'))
          matches = list(Path('/tmp/mbi-snowflake-cache').glob('minecraft-*.zip'))
          if len(matches) != 1:
              raise SystemExit(f'Expected one reconstructed archive, found {matches}')
          asset = matches[0]
          h = hashlib.sha256()
          with asset.open('rb') as stream:
              for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                  h.update(chunk)
          digest = h.hexdigest()
          with zipfile.ZipFile(asset) as archive:
              infos = archive.infolist()
              bad_member = archive.testzip()
              members = sum(1 for info in infos if not info.is_dir())
              render_relevant = sum(1 for info in infos if not info.is_dir() and ('/blockstates/' in info.filename or '/models/block/' in info.filename or '/textures/' in info.filename or '/atlases/' in info.filename))
          diagnostics = json.loads(Path('/tmp/mbi-snowflake-smoke/diagnostics.json').read_text('utf-8'))
          report = {
              'passed': asset.stat().st_size == manifest['size_bytes'] and digest == manifest['sha256'] and members == manifest['archive_members'] and render_relevant == manifest['render_relevant_members'] and bad_member is None and diagnostics.get('render_mode') == 'software-textured',
              'git_directory_present': (snapshot / '.git').exists(),
              'git_lfs_required': False,
              'remote_required': False,
              'reconstructed_size_bytes': asset.stat().st_size,
              'reconstructed_sha256': digest,
              'archive_members': members,
              'render_relevant_members': render_relevant,
              'zip_test_bad_member': bad_member,
              'render_mode': diagnostics.get('render_mode'),
              'render_tier': diagnostics.get('render_tier'),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report['passed']:
              raise SystemExit(1)
          PY
