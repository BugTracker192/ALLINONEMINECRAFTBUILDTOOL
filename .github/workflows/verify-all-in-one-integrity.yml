name: Verify all-in-one release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out ordinary Git files only
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          show-progress: false

      - name: Verify every release file and all ordinary-Git asset parts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('minecraft-build-intelligence-snowflake-all-in-one-1.0.3')
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          release = json.loads((root / 'RELEASE_FILE_MANIFEST.json').read_text('utf-8'))
          expected = {entry['path']: entry for entry in release['files']}
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          expected_actual = set(expected) | {'RELEASE_FILE_MANIFEST.json'}
          missing = sorted(expected_actual - actual)
          extra = sorted(actual - expected_actual)
          mismatches = []
          for relative, entry in sorted(expected.items()):
              path = root / relative
              if not path.is_file():
                  continue
              size = path.stat().st_size
              digest = sha256(path)
              if size != entry['size_bytes'] or digest != entry['sha256']:
                  mismatches.append({'path': relative, 'expected_size': entry['size_bytes'], 'actual_size': size, 'expected_sha256': entry['sha256'], 'actual_sha256': digest})

          asset = json.loads((root / 'app/bundled_assets/ASSET_MANIFEST.json').read_text('utf-8'))
          parts_dir = root / 'app/bundled_assets' / asset['delivery']['parts_directory']
          parts = []
          for index, entry in enumerate(asset['delivery']['parts']):
              path = parts_dir / entry['name']
              exists = path.is_file()
              size = path.stat().st_size if exists else None
              digest = sha256(path) if exists else None
              parts.append({'index': index, 'name': entry['name'], 'passed': exists and size == entry['size_bytes'] and digest == entry['sha256'], 'size_bytes': size, 'sha256': digest})

          report = {
              'passed': not missing and not extra and not mismatches and all(item['passed'] for item in parts) and not (root / 'app/bundled_assets/minecraft.zip').exists(),
              'version': release['version'],
              'manifest_file_count': release['file_count'],
              'actual_release_file_count': len(actual),
              'missing': missing,
              'extra': extra,
              'mismatches': mismatches,
              'delivery_mode': asset['delivery']['mode'],
              'parts': parts,
              'full_lfs_pointer_absent': not (root / 'app/bundled_assets/minecraft.zip').exists(),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report['passed']:
              raise SystemExit(1)
          PY

      - name: Create extracted Snowflake-style snapshot
        shell: bash
        run: |
          rm -rf /tmp/mbi-snowflake-snapshot /tmp/mbi-snowflake-cache /tmp/mbi-snowflake-smoke
          mkdir -p /tmp/mbi-snowflake-snapshot
          cp -a minecraft-build-intelligence-snowflake-all-in-one-1.0.3/. /tmp/mbi-snowflake-snapshot/
          test ! -e /tmp/mbi-snowflake-snapshot/.git
          test ! -e /tmp/mbi-snowflake-snapshot/app/bundled_assets/minecraft.zip
          test "$(find /tmp/mbi-snowflake-snapshot/app/bundled_assets/parts -type f | wc -l)" -eq 9

      - name: Run autonomous bootstrap with automatic reconstruction and textured smoke
        working-directory: /tmp/mbi-snowflake-snapshot
        env:
          MBI_ASSET_CACHE_DIR: /tmp/mbi-snowflake-cache
        run: python BOOTSTRAP_SNOWFLAKE.py --smoke --out /tmp/mbi-snowflake-smoke

      - name: Verify reconstructed archive and textured diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile

          snapshot = Path('/tmp/mbi-snowflake-snapshot')
          manifest = json.loads((snapshot / 'app/bundled_assets/ASSET_MANIFEST.json').read_text('utf-8'))
          matches = list(Path('/tmp/mbi-snowflake-cache').glob('minecraft-*.zip'))
          if len(matches) != 1:
              raise SystemExit(f'Expected one reconstructed archive, found {matches}')
          asset = matches[0]
          h = hashlib.sha256()
          with asset.open('rb') as stream:
              for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                  h.update(chunk)
          digest = h.hexdigest()
          with zipfile.ZipFile(asset) as archive:
              infos = archive.infolist()
              bad_member = archive.testzip()
              members = sum(1 for info in infos if not info.is_dir())
              render_relevant = sum(1 for info in infos if not info.is_dir() and ('/blockstates/' in info.filename or '/models/block/' in info.filename or '/textures/' in info.filename or '/atlases/' in info.filename))
          diagnostics = json.loads(Path('/tmp/mbi-snowflake-smoke/diagnostics.json').read_text('utf-8'))
          report = {
              'passed': asset.stat().st_size == manifest['size_bytes'] and digest == manifest['sha256'] and members == manifest['archive_members'] and render_relevant == manifest['render_relevant_members'] and bad_member is None and diagnostics.get('render_mode') == 'software-textured',
              'git_directory_present': (snapshot / '.git').exists(),
              'git_lfs_required': False,
              'remote_required': False,
              'reconstructed_size_bytes': asset.stat().st_size,
              'reconstructed_sha256': digest,
              'archive_members': members,
              'render_relevant_members': render_relevant,
              'zip_test_bad_member': bad_member,
              'render_mode': diagnostics.get('render_mode'),
              'render_tier': diagnostics.get('render_tier'),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report['passed']:
              raise SystemExit(1)
          PY
