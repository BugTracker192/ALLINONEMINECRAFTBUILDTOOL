name: Repair 1.0.3 generated fixture

on:
  push:
    branches: [main]
    paths: ['.github/REPAIR_1_0_3_FIXTURE_TRIGGER.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          show-progress: false

      - name: Restore and force-add exact binary fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          path = Path('minecraft-build-intelligence-snowflake-all-in-one-1.0.3/tests/fixtures/reference.schem')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(
              ''
          ))
          expected = '38b7526b6977759fcf1dd1a9f49d78eea0ed614ad88b781e556d130d3a16857f'
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if path.stat().st_size != 319 or actual != expected:
              raise SystemExit(f'Fixture verification failed: size={path.stat().st_size} sha256={actual}')
          print(f'Fixture verified: size=319 sha256={actual}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f minecraft-build-intelligence-snowflake-all-in-one-1.0.3/tests/fixtures/reference.schem
          if git diff --cached --quiet; then
            echo 'Fixture already present.'
          else
            git commit -m 'Restore 1.0.3 generated reference fixture'
            git push origin HEAD:main
          fi
