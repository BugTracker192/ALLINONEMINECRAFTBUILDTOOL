name: Diagnose 1.0.3 Snowflake bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          show-progress: false

      - name: Run bootstrap and capture exact output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/mbi-diag-snapshot /tmp/mbi-diag-cache /tmp/mbi-diag-smoke
          mkdir -p /tmp/mbi-diag-snapshot
          cp -a minecraft-build-intelligence-snowflake-all-in-one-1.0.3/. /tmp/mbi-diag-snapshot/
          cd /tmp/mbi-diag-snapshot
          set +e
          MBI_ASSET_CACHE_DIR=/tmp/mbi-diag-cache python BOOTSTRAP_SNOWFLAKE.py --smoke --out /tmp/mbi-diag-smoke > /tmp/bootstrap.log 2>&1
          status=$?
          set -e
          {
            echo "### Bootstrap diagnostic run ${{ github.run_id }}"
            echo
            echo "exit_code=$status"
            echo
            echo '```text'
            tail -c 50000 /tmp/bootstrap.log
            echo
            echo '```'
          } > /tmp/bootstrap-comment.md
          gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body-file /tmp/bootstrap-comment.md
          exit "$status"
