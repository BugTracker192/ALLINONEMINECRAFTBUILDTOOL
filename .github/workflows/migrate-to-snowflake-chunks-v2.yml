name: Migrate bundled assets to Snowflake-native Git chunks v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out and hydrate the existing LFS object
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          show-progress: false

      - name: Build the 1.0.3 Snowflake-native release
        run: python .github/scripts/migrate_chunked_v2.py

      - name: Commit ordinary Git chunks
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config http.postBuffer 1048576000
          git add -A
          git add -f minecraft-build-intelligence-snowflake-all-in-one-1.0.3/app/bundled_assets/parts/
          git commit -m 'Release 1.0.3 with Snowflake-native chunked assets'
          git push origin HEAD:main
