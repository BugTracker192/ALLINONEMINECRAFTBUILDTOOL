services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mbi
      POSTGRES_PASSWORD: mbi
      POSTGRES_DB: mbi
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U mbi"], interval: 5s, timeout: 3s, retries: 20}

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mbi
      MINIO_ROOT_PASSWORD: mbi-development-only
    volumes: [minio-data:/data]
    ports: ["9001:9001"]

  asset-permissions:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    user: "0:0"
    volumes: [mbi-data:/data]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    restart: "no"

  asset-index:
    build:
      context: .
      dockerfile: infrastructure/docker/asset-index.Dockerfile
    command: ["/input/minecraft.zip", "/data/assets/vanilla"]
    volumes:
      - ${MINECRAFT_ASSET_ZIP:-./minecraft.zip}:/input/minecraft.zip:ro
      - mbi-data:/data
    depends_on:
      asset-permissions: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      MBI_ENV: development
      MBI_DATABASE_URL: postgresql+psycopg://mbi:mbi@postgres:5432/mbi
      MBI_REDIS_URL: redis://redis:6379/0
      MBI_OBJECT_STORE_ROOT: /data
      MBI_ASSET_PACK_PATH: /data/assets/vanilla
      MBI_DEMO_INLINE_JOBS: "false"
      MBI_RENDERER_SERVICE_URL: http://renderer-service:8090
      MBI_ARTIFACT_SIGNING_SECRET: ${MBI_ARTIFACT_SIGNING_SECRET:-development-artifact-signing-secret-change-me}
      MBI_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes: [mbi-data:/data]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      asset-index: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      MBI_ENV: production
      MBI_REDIS_URL: redis://redis:6379/0
      MBI_OBJECT_STORE_ROOT: /data
    volumes: [mbi-data:/data]
    depends_on:
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    ports: ["8080:8080"]
    depends_on: [api]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]

  renderer-service:
    build:
      context: .
      dockerfile: infrastructure/docker/renderer.Dockerfile
    environment:
      MBI_WEB_BASE_URL: http://web:8080
      MBI_RENDER_OUTPUT_ROOT: /data/snapshots
    volumes: [mbi-data:/data]
    depends_on: [web]
    ports: ["8090:8090"]
    shm_size: 1gb
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mbi-data:
