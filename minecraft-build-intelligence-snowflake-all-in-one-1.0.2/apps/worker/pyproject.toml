[project]
name = "mbi-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mbi-core",
  "celery==5.5.3",
  "redis==6.4.0",
  "pydantic-settings==2.10.1"
]

[tool.uv.sources]
mbi-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbi_worker"]
