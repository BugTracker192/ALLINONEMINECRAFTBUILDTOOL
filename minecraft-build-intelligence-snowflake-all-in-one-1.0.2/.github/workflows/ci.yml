name: Snowflake Offline CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mandatory-python312:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact mandatory runtime profile
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run exact clean-environment pipeline gate
        run: python -m app.cli pipeline tests/fixtures/reference.schem --out ./ci-run --size 256x256
      - name: Install verification-only dependencies
        run: pip install '.[test]'
      - name: Run tests
        run: pytest
      - name: Audit forbidden mandatory dependencies
        run: python scripts/audit_offline_profile.py --output ./ci-run/offline-profile-audit.json
      - name: Verify CLI artifacts
        run: |
          test -f ci-run/canonical.json
          test -f ci-run/analysis.json
          test -f ci-run/snapshots/manifest.json
          test -f ci-run/export/verify_report.json
