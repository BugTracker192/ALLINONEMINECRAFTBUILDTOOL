apiVersion: v1
kind: ConfigMap
metadata: {name: mbi-config, namespace: mbi}
data:
  MBI_ENV: production
  MBI_OBJECT_STORE_ROOT: /data
  MBI_DEMO_INLINE_JOBS: "false"
  MBI_RENDERER_SERVICE_URL: http://mbi-renderer:8090
  MBI_WEB_BASE_URL: http://mbi-web:8080
  MBI_RENDERER_TIMEOUT_SECONDS: "180"
  MBI_CORS_ORIGINS: https://mbi.example.com
  MBI_RATE_LIMIT_REQUESTS: "240"
  MBI_RATE_LIMIT_WINDOW_SECONDS: "60"
  OTEL_SERVICE_NAME: mbi-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mbi-data, namespace: mbi}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 100Gi}}
