apiVersion: v1
kind: Secret
metadata:
  name: mbi-api-secrets
  namespace: mbi
type: Opaque
stringData:
  # Copy this file to a deployment-only secret source. Never commit real values.
  MBI_DATABASE_URL: postgresql+psycopg://CHANGE_ME
  MBI_REDIS_URL: redis://CHANGE_ME
  MBI_API_KEYS: CHANGE_ME_TO_A_RANDOM_API_KEY
  MBI_ARTIFACT_SIGNING_SECRET: CHANGE_ME_TO_AT_LEAST_32_RANDOM_BYTES
  MBI_PROVIDER_KEY_ENCRYPTION_SECRET: CHANGE_ME_TO_AT_LEAST_32_RANDOM_BYTES
