apiVersion: apps/v1
kind: Deployment
metadata: {name: mbi-worker, namespace: mbi}
spec:
  replicas: 2
  selector: {matchLabels: {app: mbi-worker}}
  template:
    metadata: {labels: {app: mbi-worker}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/example/mbi-worker:1.0.0
          args: ["celery", "-A", "mbi_worker.app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
          envFrom: [{secretRef: {name: mbi-api-secrets}}, {configMapRef: {name: mbi-config}}]
          volumeMounts: [{name: data, mountPath: /data}, {name: scratch, mountPath: /tmp/jobs}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "4", memory: 4Gi, ephemeral-storage: 8Gi}}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mbi-data}
        - name: scratch
          emptyDir: {sizeLimit: 8Gi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: mbi-worker, namespace: mbi}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: mbi-worker}
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
